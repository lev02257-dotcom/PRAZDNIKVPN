name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Распаковать архив проекта (если загружен zip)
        run: |
          if [ -f PRAZDNIK-VPN.zip ]; then
            unzip PRAZDNIK-VPN.zip
          fi
          echo "--- содержимое репозитория ---"
          ls -la

      - name: Собрать debug APK
        run: |
          if [ -d PRAZDNIK-VPN ]; then
            cd PRAZDNIK-VPN
          fi
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug

      - name: Отправить APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: prazdnik-vpn-apk
          path: '**/app-debug.apk'
          
